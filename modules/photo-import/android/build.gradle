plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.aniseekr.photoimport'
version = '0.1.0'

android {
  namespace "expo.modules.aniseekr.photoimport"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  implementation "androidx.exifinterface:exifinterface:1.4.1"
}
